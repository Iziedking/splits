[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.30"
# Arc targets the Osaka baseline (docs.arc.io, checked 2026-10-11). Prague output runs there unchanged.
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
remappings = [
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.3.0/",
  "forge-std/=dependencies/forge-std-1.9.7/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.ci.fuzz]
runs = 20000

[lint]
# Test fixtures cast known-small constants to uint96. Production code stays linted.
ignore = ["test/**/*.sol", "script/**/*.sol"]

[dependencies]
"@openzeppelin-contracts" = "5.3.0"
forge-std = "1.9.7"

[soldeer]
remappings_generate = false
remappings_regenerate = false

[rpc_endpoints]
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
arc_testnet = "${ARC_TESTNET_RPC_URL}"
