name: Splits production

# mysplits.xyz is served entirely from the shared host (ArcRun's Caddy fronts it; no Vercel).
# verify proves the commit, image packs it, deploy ships the SAME commit's image and asks the
# root-owned /usr/local/sbin/splits-deploy on the host to roll it out (or roll it back).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "contracts/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: splits-production-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: "22.23.3"
  # Arc's Foundry fork: USDC on Arc checks a blocklist precompile stock Foundry doesn't know.
  ARC_FOUNDRY_URL: https://github.com/circlefin/arc-foundry/releases/download/v0.8.0-2/arc-foundry-v0.8.0-2-x86_64-unknown-linux-gnu.tar.gz
  ARC_FOUNDRY_SHA256: 088bdb96a84418b757f9825d491e702792f1d1d1e29a9145af305a6600a79556
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Arc Foundry (sha256 pinned)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arc-foundry.tar.gz"
          dir="$RUNNER_TEMP/arc-foundry"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 -o "$archive" "$ARC_FOUNDRY_URL"
          echo "$ARC_FOUNDRY_SHA256  $archive" | sha256sum --check --strict -
          mkdir -p "$dir"
          tar -xzf "$archive" -C "$dir"
          rm -f "$archive"
          test -x "$dir/forge"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Build contracts (the web ABI test reads contracts/out)
        working-directory: contracts
        run: |
          forge --version
          forge soldeer install
          forge build --sizes
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install web dependencies
        working-directory: web
        run: |
          npm_retry() {
            local attempt=1
            until npm "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "npm command failed after ${attempt} attempts: npm $*" >&2
                return 1
              fi
              echo "npm command failed; retrying in $((attempt * 15))s (attempt $((attempt + 1))/3): npm $*" >&2
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }
          npm_retry ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Test
        working-directory: web
        run: npx vitest run
      - name: Build
        working-directory: web
        run: npx next build
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build immutable image
        env:
          # Public value (cloud.reown.com), inlined into the client bundle at build time.
          WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID || secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WALLETCONNECT_PROJECT_ID" ]; then
            echo "::warning::NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID is not set; paying from your own wallet is unavailable in this image."
            echo "NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID is not set; wallet payments are off in this image." >> "$GITHUB_STEP_SUMMARY"
          fi
          docker build \
            --build-arg NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID="$WALLETCONNECT_PROJECT_ID" \
            -t "splits-api:$SHA" web
          mkdir -p bundle
          docker save "splits-api:$SHA" | gzip > bundle/splits-api.tar.gz
          cp deploy/compose.yml bundle/compose.yml
          cd bundle
          sha256sum splits-api.tar.gz compose.yml > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splits-release-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, image]
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No VPS configured; tests passed, production was NOT deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            test -n "$VPS_USER" && test -n "$VPS_KEY" && test -n "$VPS_FINGERPRINT" || { echo "Incomplete VPS configuration"; exit 1; }
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          name: splits-release-${{ github.sha }}
          path: bundle
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        if: steps.gate.outputs.ready == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: bundle/*
          target: /opt/splits/incoming/${{ github.sha }}
          strip_components: 1
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        if: steps.gate.outputs.ready == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: sudo -n /usr/local/sbin/splits-deploy ${{ github.sha }}
      - name: Verify public health
        if: steps.gate.outputs.ready == 'true'
        env:
          HEALTH_URL: https://mysplits.xyz/api/health
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 "$HEALTH_URL" > "$tmp_dir/health.json"
          python3 - "$tmp_dir/health.json" <<'PY'
          import json
          import sys

          health = json.load(open(sys.argv[1], encoding="utf-8"))
          assert health.get("ok") is True, f"Splits did not report ok: {health}"
          assert health.get("chainId") == 5042, f"unexpected chain: {health.get('chainId')}"
          print(f"mysplits.xyz healthy on {health.get('network')} (chain {health.get('chainId')}).")
          PY
